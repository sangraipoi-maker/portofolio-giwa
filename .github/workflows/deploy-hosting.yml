name: Deploy Hosting — Portofolio (Firebase)

# MANUAL saja (workflow_dispatch) — aktif setelah project Firebase portofolio
# dibuat & secret FIREBASE_SERVICE_ACCOUNT_PORTOFOLIO diisi di repo ini.
# Tanpa secret itu workflow ini sengaja tidak berjalan otomatis.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTOFOLIO }}
          channelId: live
